services:
  estoque-db:
    image: postgres:16-alpine
    container_name: estoque-db
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - estoque-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estoque"]
      interval: 5s
      timeout: 5s
      retries: 10

  faturamento-db:
    image: postgres:16-alpine
    container_name: faturamento-db
    environment:
      POSTGRES_DB: faturamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - faturamento-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faturamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  estoque-api:
    build:
      context: ./backend/Estoque.Api
      dockerfile: Dockerfile
    container_name: estoque-api
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__EstoqueDb=Host=estoque-db;Port=5432;Database=estoque;Username=postgres;Password=postgres
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      estoque-db:
        condition: service_healthy

  faturamento-api:
    build:
      context: ./backend/Faturamento.Api
      dockerfile: Dockerfile
    container_name: faturamento-api
    ports:
      - "5002:8080"
    environment:
      - ConnectionStrings__FaturamentoDb=Host=faturamento-db;Port=5432;Database=faturamento;Username=postgres;Password=postgres
      - EstoqueApi__BaseUrl=http://estoque-api:8080/
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      faturamento-db:
        condition: service_healthy
      estoque-api:
        condition: service_started

  angular-app:
    build:
      context: ./frontend/notas-fiscais-app
      dockerfile: Dockerfile
    container_name: angular-app
    ports:
      - "4200:80"
    depends_on:
      - estoque-api
      - faturamento-api

volumes:
  estoque-db-data:
  faturamento-db-data:
